name: 功能建议
description: 提出新平台支持、新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。请先说明**要解决什么问题**，再说希望怎么做。

  - type: dropdown
    id: category
    attributes:
      label: 建议类型
      options:
        - 新增购物平台支持
        - 抓取 / 解析能力改进
        - 界面与交互
        - 数据记录与导出
        - 通知方式（邮件 / 微信 / Telegram 等）
        - 运行方式（后台常驻 / 计划任务 / Docker 等）
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 例如"我想让价格达标时能推到手机上，而不是只在电脑上弹窗"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的设想
      description: 有想法就写，没有也可以只描述问题
    validations:
      required: false

  - type: textarea
    id: alternative
    attributes:
      label: 你目前是怎么绕过去的
      description: 临时方案也有参考价值
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，确认不是重复建议
          required: true
